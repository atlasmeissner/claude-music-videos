[project]
name = "analysis"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
  "torch",
  "torchaudio",
  "demucs",
  "librosa",
  "soundfile",
  "numpy",
  "scipy",
  "faster-whisper",
  "matplotlib",
  "numba>=0.68.0",
]
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
