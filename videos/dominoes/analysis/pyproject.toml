[project]
name = "dominoes-analysis"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy<2.3",
  "scipy",
  "librosa>=0.10",
  "soundfile",
  "torch==2.5.1",
  "torchaudio==2.5.1",
  "demucs>=4.0.1",
  "faster-whisper>=1.0",
  "matplotlib",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
